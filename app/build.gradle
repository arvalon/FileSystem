apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {

    defaultConfig {
        applicationId "com.example.admin.filesystem"
        minSdkVersion 23
        compileSdk 36
        targetSdkVersion 36
        versionCode 17
        versionName "2.9"
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationVariants.all { variant -> renameAPK(variant)}
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_24
        targetCompatibility JavaVersion.VERSION_24
    }

    buildFeatures {
        buildConfig = true
    }

    namespace 'com.example.admin.filesystem'
}

def renameAPK(variant) {
    variant.outputs.all { output ->
        outputFileName = "FileSystem_v_${variant.versionName}".replace('.', "_") + ".apk"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'

    implementation 'androidx.navigation:navigation-fragment:2.9.7'
    implementation 'androidx.navigation:navigation-ui:2.9.7'

    //implementation 'commons-io:commons-io:2.5'
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    implementation "androidx.core:core-ktx:1.18.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation 'androidx.multidex:multidex:2.0.1'

    implementation project(path: ':GetSerial')

    testImplementation 'junit:junit:4.13.2'
}
